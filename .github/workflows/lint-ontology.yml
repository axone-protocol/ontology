name: Lint / Ontology

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-ontology.yml'
      - 'src/**/*.ttl'
      - 'Makefile'
      - 'flake.lock'
      - 'flake.nix'

  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lint-ontology.yml'
      - 'src/**/*.ttl'
      - 'Makefile'
      - 'flake.lock'
      - 'flake.nix'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-ontology:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23


      - name: Validate RDF files (Turtle)
        run: nix develop --command make lint-ttl

      - name: Check RDF files (Turtle) are formatted
        run: |
          nix develop --command make format-ttl
          if [[ $(git status -s) ]]; then
            >&2 echo 'There is a diff between formatted files and source code'
            >&2 git status
            exit 1
          fi
