name: Test / Ontology

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-ontology.yml'
      - 'src/**/*.ttl'
      - 'test/**/*.ttl'
      - 'Makefile'
      - 'version'

  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-ontology.yml'
      - 'src/**/*.ttl'
      - 'test/**/*.ttl'
      - 'Makefile'
      - 'version'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ontology:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test ontology
        run: |
          make test-ontology

      - name: Output test results
        if: ${{ failure() }}
        run: |
          find target/test -name '*.tested.flag' -type f \
            -exec grep -q 'Conforms: False' {} \; \
            -exec echo '❌ {}' \; \
            -exec cat {} \; \
            -exec echo '' \;
