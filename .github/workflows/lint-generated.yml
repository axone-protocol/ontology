name: Lint / Generated

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-generated.yml'
      - 'src/**'
      - 'script/**'
      - 'Makefile'
      - 'flake.lock'
      - 'flake.nix'

  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lint-generated.yml'
      - 'src/**'
      - 'script/**'
      - 'Makefile'
      - 'flake.lock'
      - 'flake.nix'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-generated:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22


      - name: Generate documentation
        run: |
          find docs -type f -name '*.md' -exec chmod "$NUMBER_OF_THE_BEAST" {} + # This is a hack
          nix develop --command make docs
        env:
          NUMBER_OF_THE_BEAST: 666

      - name: Check Git diff in generated files (docs)
        run: |
          if [[ $(git status -s) != '' ]]; then
            >&2 echo 'There is a diff between generated files and source code'
            >&2 git status
            exit 1
          fi
